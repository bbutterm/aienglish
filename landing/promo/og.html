<!doctype html>
<!-- Шаблон для OG-картинки (1200×630) и apple-touch-icon (180×180).
     Рендер: node render-og.js  →  ../assets/og.png, ../assets/apple-touch-icon.png -->
<html lang="ru">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#FBF8F1; --card:#FFFFFF; --ink:#1B1A17; --ink-2:#5C5A52; --line:#E8E3D6; --marker:#FFE066; --pen:#E5484D; --fix:#1E8E5A; --sky:#3B6FD8; --out:#FFF4C4; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--paper); font-family: Onest, sans-serif; color: var(--ink); }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--paper);
    background-image: linear-gradient(rgba(59,111,216,.09) 1px, transparent 1px), linear-gradient(90deg, rgba(59,111,216,.09) 1px, transparent 1px);
    background-size: 30px 30px; }
  .og::before { content: ""; position: absolute; top: 0; bottom: 0; left: 74px; width: 2px; background: rgba(229,72,77,.45); }
  .logo { position: absolute; left: 110px; top: 62px; display: flex; align-items: center; gap: 14px; font: 700 28px/1 Unbounded; }
  .logo svg { width: 52px; height: 52px; }
  h1 { position: absolute; left: 110px; top: 168px; width: 640px; font: 700 60px/1.1 Unbounded; letter-spacing: -.01em; }
  .hl { background: linear-gradient(var(--marker), var(--marker)) no-repeat 0 88% / 100% .55em; padding: 0 .06em; margin: 0 -.06em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .sub { position: absolute; left: 110px; bottom: 64px; font: 500 26px/1.35 Onest; color: var(--ink-2); width: 600px; }
  .chat { position: absolute; right: 60px; top: 120px; width: 420px; display: flex; flex-direction: column; gap: 16px; transform: rotate(2.5deg); }
  .b { background: var(--card); border: 1.5px solid var(--line); border-radius: 22px; padding: 16px 20px; font-size: 22px; line-height: 1.35; }
  .b.out { align-self: flex-end; background: var(--out); border-color: #F3DE8A; border-bottom-right-radius: 7px; width: 330px; }
  .b.in { align-self: flex-start; border-bottom-left-radius: 7px; }
  .voice { display: flex; align-items: center; gap: 14px; }
  .play { width: 50px; height: 50px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; flex: none; }
  .play svg { width: 20px; height: 20px; fill: var(--paper); margin-left: 3px; }
  .wave { display: flex; gap: 3px; align-items: center; height: 36px; flex: 1; }
  .wave i { width: 4px; border-radius: 2px; background: rgba(27,26,23,.45); }
  .tx { font-size: 19px; color: var(--ink); margin-top: 10px; }
  .fix { font-size: 30px; font-weight: 600; display: flex; align-items: center; gap: 12px; white-space: nowrap; }
  .s { position: relative; color: var(--ink-2); }
  .s svg { position: absolute; left: -4%; top: 32%; width: 108%; height: 50%; overflow: visible; }
  .s path { fill: none; stroke: var(--pen); stroke-width: 4; stroke-linecap: round; }
  .m { background: var(--marker); padding: 2px 10px; border-radius: 6px; }
  .why { font-size: 19px; color: var(--ink-2); margin-top: 8px; }
  .lbl { font-size: 16px; color: var(--ink-2); margin-bottom: 6px; }
  .ava { width: 40px; height: 40px; border-radius: 50%; background: var(--sky); color: #fff; display: grid; place-items: center; font: 700 17px/1 Unbounded; }
  .row { display: flex; gap: 12px; align-items: flex-end; }

  .icon { width: 180px; height: 180px; background: var(--marker); display: grid; place-items: center; }
  .icon svg { width: 128px; height: 128px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="og" id="og">
  <div class="logo">
    <svg viewBox="0 0 64 64"><path d="M15 7h34a11 11 0 0 1 11 11v19a11 11 0 0 1-11 11H27l-12.5 9.5V48A11 11 0 0 1 4 37V18A11 11 0 0 1 15 7Z" fill="#fff"/><path d="M10.5 29.5 51 23.5 54 35 13.5 41Z" fill="#FFE066" stroke="#FFE066" stroke-width="2.5" stroke-linejoin="round"/><path d="M15 7h34a11 11 0 0 1 11 11v19a11 11 0 0 1-11 11H27l-12.5 9.5V48A11 11 0 0 1 4 37V18A11 11 0 0 1 15 7Z" fill="none" stroke="#1B1A17" stroke-width="4.5" stroke-linejoin="round"/></svg>
    English Buddy
  </div>
  <h1>Болтай по‑английски с&nbsp;<span class="hl">другом-носителем</span></h1>
  <p class="sub">Он заметит ошибки и соберёт из них урок. Прямо в Telegram.</p>

  <div class="chat">
    <div class="b out">
      <div class="voice"><span class="play"><svg viewBox="0 0 24 24"><path d="M7 4.8v14.4c0 .8.9 1.3 1.6.8l11-7.2c.6-.4.6-1.2 0-1.6l-11-7.2C7.9 3.5 7 4 7 4.8Z"/></svg></span><div class="wave" id="wave"></div></div>
      <p class="tx">…and I am agree with my wife — it’s time.</p>
    </div>
    <div class="row">
      <span class="ava">J</span>
      <div class="b in">
        <p class="lbl">Кстати:</p>
        <p class="fix"><span class="s">I am agree<svg viewBox="0 0 100 20" preserveAspectRatio="none"><path d="M1 13C18 10 40 14 62 11S92 9 99 10" vector-effect="non-scaling-stroke"/></svg></span><span style="color:var(--ink-2)">→</span><span class="m">I agree</span></p>
        <p class="why">agree — уже глагол, am не нужен</p>
      </div>
    </div>
  </div>
</div>

<div class="icon" id="icon" hidden>
  <svg viewBox="0 0 64 64"><path d="M15 7h34a11 11 0 0 1 11 11v19a11 11 0 0 1-11 11H27l-12.5 9.5V48A11 11 0 0 1 4 37V18A11 11 0 0 1 15 7Z" fill="#fff"/><path d="M10.5 29.5 51 23.5 54 35 13.5 41Z" fill="#FFE066" stroke="#FFE066" stroke-width="2.5" stroke-linejoin="round"/><path d="M15 7h34a11 11 0 0 1 11 11v19a11 11 0 0 1-11 11H27l-12.5 9.5V48A11 11 0 0 1 4 37V18A11 11 0 0 1 15 7Z" fill="none" stroke="#1B1A17" stroke-width="4.5" stroke-linejoin="round"/></svg>
</div>
<script>
  let h = ''; for (let i = 0; i < 34; i++) { const v = Math.abs(Math.sin(i * 1.31 + 3) * Math.cos(i * .47 + 5.1)); h += `<i style="height:${Math.round(20 + 80 * (0.3 + 0.7 * v))}%"></i>`; }
  document.getElementById('wave').innerHTML = h;
  if (location.hash === '#icon') { document.getElementById('og').hidden = true; document.getElementById('icon').hidden = false; }
</script>
</body>
</html>
