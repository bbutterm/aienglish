[project]
name = "english-buddy"
version = "0.1.0"
description = "Telegram-бот для практики английского через живое общение"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "alembic>=1.20",
    "asyncpg>=0.32",
    "fastapi>=0.162",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "tzdata>=2026.1",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# Фикстуры harness/web импортируются из соседних модулей тестов.
"tests/test_features_*.py" = ["F401", "F811"]
